<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Sigma Phonk Dark Monochrome Gradient -->
    <linearGradient id="chadBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Moai Statue 🗿 Def -->
    <g id="moaiStatue" transform="scale(0.85)">
      <!-- Long stone face -->
      <path d="M 20 15 L 45 15 L 45 35 L 55 42 L 45 55 L 45 75 L 20 75 Z" fill="#64748b" stroke="#334155" stroke-width="2.5" />
      <!-- Brow & deep eye -->
      <rect x="22" y="24" width="22" height="6" fill="#1e293b" />
      <!-- Prominent nose -->
      <polygon points="45,35 55,48 45,52" fill="#94a3b8" />
      <!-- Thick stone lips -->
      <rect x="30" y="60" width="16" height="5" rx="2" fill="#334155" />
      <!-- Chiseled jaw highlight -->
      <line x1="20" y1="75" x2="45" y2="75" stroke="#00f0ff" stroke-width="2.5" />
    </g>

    <!-- Cool Sunglasses -->
    <g id="coolShades">
      <polygon points="5,5 28,5 24,20 8,20" fill="#000000" stroke="#00f0ff" stroke-width="2" />
      <polygon points="32,5 55,5 52,20 36,20" fill="#000000" stroke="#00f0ff" stroke-width="2" />
      <line x1="28" y1="8" x2="32" y2="8" stroke="#00f0ff" stroke-width="2.5" />
      <line x1="10" y1="9" x2="22" y2="15" stroke="#ffffff" stroke-width="1.5" />
      <line x1="38" y1="9" x2="50" y2="15" stroke="#ffffff" stroke-width="1.5" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#chadBg)" />

  <!-- Sigma Neon Cyan Laser Borders -->
  <rect x="16" y="16" width="768" height="1168" rx="16" fill="none" stroke="#00f0ff" stroke-width="3.5" />
  <rect x="24" y="24" width="752" height="1152" rx="10" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="14 10" />

  <!-- Top Center Speech Bubble -->
  <g transform="translate(400, 52)">
    <rect x="-210" y="-22" width="420" height="44" rx="12" fill="#020617" stroke="#00f0ff" stroke-width="2.5" />
    <text x="0" y="7" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" fill="#00f0ff" text-anchor="middle" letter-spacing="2">
      🗿 AVERAGE PHOTOBOOTH ENJOYER 🗿
    </text>
  </g>

  <!-- Top Left: Moai Statue -->
  <use href="#moaiStatue" x="35" y="22" />

  <!-- Top Right: Pixel Sunglasses -->
  <use href="#coolShades" x="710" y="36" />

  <!-- Side Meme Badges -->
  <g transform="translate(22, 340)">
    <rect x="0" y="0" width="115" height="32" rx="8" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
    <text x="57" y="21" font-family="'Impact', sans-serif" font-size="12" fill="#00f0ff" text-anchor="middle">MEWING: 100% 🤫</text>
  </g>
  <g transform="translate(22, 680)">
    <rect x="0" y="0" width="110" height="32" rx="8" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
    <text x="55" y="21" font-family="'Impact', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">CAN YOU FEEL 🎶</text>
  </g>

  <g transform="translate(670, 360)">
    <rect x="0" y="0" width="105" height="32" rx="8" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
    <text x="52" y="21" font-family="'Impact', sans-serif" font-size="12" fill="#00f0ff" text-anchor="middle">GIGACHAD 🗿</text>
  </g>
  <g transform="translate(670, 700)">
    <rect x="0" y="0" width="105" height="32" rx="8" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
    <text x="52" y="21" font-family="'Impact', sans-serif" font-size="12" fill="#ffffff" text-anchor="middle">MY HEART ⚡</text>
  </g>

  <!-- Bottom Left: Moai Statue with Sunglasses -->
  <g transform="translate(35, 1070)">
    <use href="#moaiStatue" x="0" y="0" />
    <use href="#coolShades" x="15" y="18" transform="scale(0.7)" />
  </g>

  <!-- Bottom Right: Jawline Arrow Badge -->
  <g transform="translate(685, 1080)">
    <rect x="0" y="0" width="90" height="38" rx="8" fill="#000000" stroke="#00f0ff" stroke-width="2" />
    <text x="45" y="24" font-family="'Impact', sans-serif" font-size="13" fill="#00f0ff" text-anchor="middle">JAWLINE 📐</text>
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#000000" stroke="#00f0ff" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="2">
      🗿 SHH... MEWING STREAK UNBROKEN 🤫🧏‍♂️
    </text>
  </g>
</svg>
