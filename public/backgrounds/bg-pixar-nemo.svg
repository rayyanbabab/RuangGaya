<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Deep Ocean Gradient -->
    <linearGradient id="oceanDeepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#082f49" />
      <stop offset="35%" stop-color="#0284c7" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Water Bubble Def -->
    <g id="bubble">
      <circle cx="0" cy="0" r="12" fill="none" stroke="#e0f2fe" stroke-width="2" opacity="0.75" />
      <ellipse cx="-4" cy="-4" rx="3" ry="5" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Cute Clownfish (Nemo) -->
    <g id="nemoFish" transform="scale(0.85)">
      <!-- Body -->
      <ellipse cx="40" cy="25" rx="35" ry="22" fill="#f97316" stroke="#c2410c" stroke-width="2" />
      <!-- Tail fin -->
      <polygon points="5,25 -15,10 -15,40" fill="#f97316" stroke="#c2410c" stroke-width="2" />
      <!-- White stripes -->
      <path d="M 22 7 Q 26 25 22 43" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" />
      <path d="M 45 3 Q 50 25 45 47" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" />
      <!-- Lucky small fin -->
      <ellipse cx="32" cy="30" rx="8" ry="5" fill="#ea580c" />
      <!-- Big Eye -->
      <circle cx="58" cy="20" r="7" fill="#ffffff" stroke="#c2410c" stroke-width="1.5" />
      <circle cx="60" cy="20" r="3.5" fill="#0f172a" />
      <circle cx="58" cy="18" r="1.5" fill="#ffffff" />
    </g>

    <!-- Cute Blue Tang (Dory) -->
    <g id="doryFish" transform="scale(0.8)">
      <!-- Oval Body -->
      <ellipse cx="40" cy="25" rx="36" ry="24" fill="#2563eb" stroke="#1d4ed8" stroke-width="2" />
      <!-- Yellow Tail -->
      <polygon points="4,25 -18,8 -18,42" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
      <ellipse cx="38" cy="16" rx="20" ry="8" fill="#1e1b4b" opacity="0.8" />
      <ellipse cx="25" cy="28" rx="10" ry="6" fill="#facc15" />
      <!-- Eye -->
      <circle cx="56" cy="18" r="8" fill="#ec4899" stroke="#be185d" stroke-width="1.5" />
      <circle cx="58" cy="18" r="4" fill="#0f172a" />
      <circle cx="56" cy="16" r="1.5" fill="#ffffff" />
    </g>

    <!-- Pink Jellyfish -->
    <g id="jellyfish" opacity="0.85" transform="scale(0.8)">
      <path d="M 0 25 C 0 5, 45 5, 45 25 Z" fill="#f472b6" stroke="#db2777" stroke-width="2" />
      <!-- Tentacles -->
      <path d="M 8 25 Q 4 45 8 60 M 18 25 Q 22 45 18 60 M 27 25 Q 23 45 27 60 M 37 25 Q 41 45 37 60" stroke="#f472b6" stroke-width="2" fill="none" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#oceanDeepGrad)" />

  <!-- Bubbles floating upwards -->
  <use href="#bubble" x="40" y="160" transform="scale(1.2)" />
  <use href="#bubble" x="720" y="240" transform="scale(0.9)" />
  <use href="#bubble" x="35" y="480" transform="scale(0.7)" />
  <use href="#bubble" x="735" y="560" transform="scale(1.1)" />
  <use href="#bubble" x="45" y="760" transform="scale(0.85)" />
  <use href="#bubble" x="730" y="860" transform="scale(1)" />
  <use href="#bubble" x="120" y="1080" transform="scale(0.75)" />
  <use href="#bubble" x="660" y="1080" transform="scale(0.8)" />

  <!-- Coral Reef Bottom Silhouette -->
  <path d="M 0 1200 L 0 1140 Q 60 1100 120 1150 Q 180 1090 240 1160 L 240 1200 Z" fill="#ec4899" opacity="0.6" />
  <path d="M 560 1200 L 560 1150 Q 640 1080 720 1140 Q 760 1110 800 1130 L 800 1200 Z" fill="#14b8a6" opacity="0.6" />

  <!-- Marine Frame Borders -->
  <rect x="18" y="18" width="764" height="1164" rx="22" fill="none" stroke="#38bdf8" stroke-width="3" />
  <rect x="26" y="26" width="748" height="1148" rx="16" fill="none" stroke="#facc15" stroke-width="1.5" stroke-dasharray="10 8" />

  <!-- Top Left: Nemo Fish -->
  <use href="#nemoFish" x="35" y="32" />

  <!-- Top Right: Dory Fish -->
  <use href="#doryFish" x="690" y="32" />

  <!-- Side Swimmers -->
  <use href="#jellyfish" x="25" y="320" />
  <use href="#jellyfish" x="735" y="680" transform="scale(-1, 1) translate(-50, 0)" />

  <!-- Bottom Left: Sea Turtle Dude -->
  <g transform="translate(35, 1070) scale(0.85)">
    <!-- Shell -->
    <ellipse cx="40" cy="30" rx="30" ry="22" fill="#16a34a" stroke="#15803d" stroke-width="2.5" />
    <path d="M 22 22 L 36 22 L 44 32 L 32 38 L 22 30 Z" fill="#22c55e" />
    <!-- Flippers -->
    <ellipse cx="16" cy="14" rx="14" ry="7" fill="#15803d" transform="rotate(-30 16 14)" />
    <ellipse cx="64" cy="14" rx="14" ry="7" fill="#15803d" transform="rotate(30 64 14)" />
    <!-- Head -->
    <ellipse cx="40" cy="5" rx="10" ry="8" fill="#15803d" />
  </g>

  <!-- Bottom Right: Nemo & Dory Swirl -->
  <g transform="translate(685, 1075)">
    <use href="#nemoFish" x="0" y="0" transform="scale(0.8)" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#082f49" stroke="#38bdf8" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Comic Sans MS', cursive" font-size="18" font-weight="bold" fill="#7dd3fc" text-anchor="middle">
      🌊 Just Keep Swimming • Just Keep Swimming 🐠
    </text>
  </g>
</svg>
