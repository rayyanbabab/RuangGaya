<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Dark Comic Cyber Gradient -->
    <linearGradient id="skullBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Neon Skull Def -->
    <g id="neonSkull" transform="scale(0.85)">
      <!-- Head -->
      <ellipse cx="28" cy="24" rx="22" ry="20" fill="#ffffff" stroke="#00f0ff" stroke-width="2.5" />
      <rect x="16" y="36" width="24" height="14" fill="#ffffff" stroke="#00f0ff" stroke-width="2.5" />
      <!-- Eyes -->
      <circle cx="19" cy="22" r="6" fill="#0f172a" />
      <circle cx="37" cy="22" r="6" fill="#0f172a" />
      <!-- Nose -->
      <polygon points="28,30 25,36 31,36" fill="#0f172a" />
      <!-- Teeth -->
      <line x1="22" y1="40" x2="22" y2="48" stroke="#0f172a" stroke-width="2" />
      <line x1="28" y1="40" x2="28" y2="48" stroke="#0f172a" stroke-width="2" />
      <line x1="34" y1="40" x2="34" y2="48" stroke="#0f172a" stroke-width="2" />
    </g>

    <g id="fireHundred">
      <rect x="0" y="0" width="46" height="24" rx="6" fill="#dc2626" />
      <text x="23" y="17" font-family="'Impact', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">100</text>
      <line x1="6" y1="20" x2="40" y2="20" stroke="#ffffff" stroke-width="2" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#skullBg)" />

  <!-- Neon Glowing Cyber Grid Lines -->
  <rect x="16" y="16" width="768" height="1168" rx="20" fill="none" stroke="#00f0ff" stroke-width="3" />
  <rect x="24" y="24" width="752" height="1152" rx="14" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="12 8" />

  <!-- Top Center Speech Bubble -->
  <g transform="translate(400, 52)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#000000" stroke="#00f0ff" stroke-width="2.5" />
    <text x="0" y="7" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" fill="#00f0ff" text-anchor="middle" letter-spacing="1.5">
      💀 I'M DEAD BRO • FOR REAL 😭
    </text>
  </g>

  <!-- Top Left: Neon Skull -->
  <use href="#neonSkull" x="35" y="26" />

  <!-- Top Right: 100 Fire Badge -->
  <use href="#fireHundred" x="710" y="36" />

  <!-- Side Meme Badges -->
  <g transform="translate(24, 320)">
    <rect x="0" y="0" width="105" height="30" rx="8" fill="#ec4899" />
    <text x="52" y="20" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">NO CAP 🧢</text>
  </g>
  <g transform="translate(24, 650)">
    <rect x="0" y="0" width="105" height="30" rx="8" fill="#8b5cf6" />
    <text x="52" y="20" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">REAL 🗣️🔥</text>
  </g>

  <g transform="translate(670, 340)">
    <rect x="0" y="0" width="105" height="30" rx="8" fill="#eab308" />
    <text x="52" y="20" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">LMAOO 💀</text>
  </g>
  <g transform="translate(670, 680)">
    <rect x="0" y="0" width="105" height="30" rx="8" fill="#00f0ff" />
    <text x="52" y="20" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">COOKED 🔥</text>
  </g>

  <!-- Floating Skull Icons on Borders -->
  <use href="#neonSkull" x="35" y="800" transform="scale(0.75)" />
  <use href="#neonSkull" x="725" y="800" transform="scale(0.75)" />

  <!-- Bottom Left: Skull Trio -->
  <g transform="translate(35, 1075)">
    <use href="#neonSkull" x="0" y="0" />
    <text x="55" y="32" font-family="'Impact', sans-serif" font-size="14" fill="#00f0ff">💀💀</text>
  </g>

  <!-- Bottom Right: Fire 100 -->
  <g transform="translate(710, 1085)">
    <use href="#fireHundred" x="0" y="0" />
    <text x="22" y="36" font-family="'Arial Black', sans-serif" font-size="9" fill="#ec4899" text-anchor="middle">FR FR</text>
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#000000" stroke="#ec4899" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      💀 I CAN'T EVEN • LMAO I'M DEAD 😭🔥
    </text>
  </g>
</svg>
