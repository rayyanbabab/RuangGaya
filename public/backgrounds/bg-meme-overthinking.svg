<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Midnight 3 AM Dark Blue Gradient -->
    <linearGradient id="overthinkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Digital 03:00 Alarm Clock -->
    <g id="digitalClock" transform="scale(0.85)">
      <rect x="0" y="0" width="110" height="45" rx="8" fill="#000000" stroke="#334155" stroke-width="2" />
      <text x="55" y="32" font-family="'Courier New', monospace" font-size="24" font-weight="900" fill="#22c55e" text-anchor="middle">03:00</text>
    </g>

    <!-- Hypnotic Spiral Eye Cat -->
    <g id="spiralCat" transform="scale(0.85)">
      <!-- Cat Head -->
      <ellipse cx="40" cy="40" rx="34" ry="26" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" />
      <!-- Ears -->
      <polygon points="12,24 22,2 35,20" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <polygon points="45,20 58,2 68,24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <!-- Giant Spiral Void Eyes -->
      <circle cx="28" cy="36" r="12" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
      <circle cx="28" cy="36" r="8" fill="#000000" />
      <circle cx="28" cy="36" r="4" fill="#38bdf8" />
      <circle cx="52" cy="36" r="12" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
      <circle cx="52" cy="36" r="8" fill="#000000" />
      <circle cx="52" cy="36" r="4" fill="#38bdf8" />
      <!-- Flat Mouth -->
      <line x1="36" y1="52" x2="44" y2="52" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Floating Thought Cloud Bubble -->
    <g id="thoughtCloud">
      <ellipse cx="40" cy="20" rx="35" ry="16" fill="#ffffff" />
      <circle cx="20" cy="12" r="12" fill="#ffffff" />
      <circle cx="48" cy="8" r="14" fill="#ffffff" />
      <circle cx="62" cy="18" r="12" fill="#ffffff" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#overthinkBg)" />

  <!-- Borders -->
  <rect x="18" y="18" width="764" height="1164" rx="20" fill="none" stroke="#38bdf8" stroke-width="3" />
  <rect x="26" y="26" width="748" height="1148" rx="14" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="12 8" />

  <!-- Top Center: Speech Bubble -->
  <g transform="translate(400, 52)">
    <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#000000" stroke="#38bdf8" stroke-width="2.5" />
    <text x="0" y="7" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      👀 OVERTHINKING JAM 3 PAGI 🌀
    </text>
  </g>

  <!-- Top Left: Digital Alarm Clock 03:00 -->
  <use href="#digitalClock" x="35" y="28" />

  <!-- Top Right: Spiral Staring Cat -->
  <use href="#spiralCat" x="690" y="22" />

  <!-- Random Late Night Thoughts on Borders -->
  <g transform="translate(22, 280)">
    <rect x="0" y="0" width="125" height="36" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
    <text x="62" y="16" font-family="'Comic Sans MS', cursive" font-size="9" fill="#e0e7ff" text-anchor="middle">"Kenapa cicak</text>
    <text x="62" y="28" font-family="'Comic Sans MS', cursive" font-size="9" fill="#e0e7ff" text-anchor="middle">nggak jatuh?" 🤔</text>
  </g>

  <g transform="translate(22, 600)">
    <rect x="0" y="0" width="125" height="36" rx="10" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
    <text x="62" y="16" font-family="'Comic Sans MS', cursive" font-size="9" fill="#e0e7ff" text-anchor="middle">"Besok sarapan</text>
    <text x="62" y="28" font-family="'Comic Sans MS', cursive" font-size="9" fill="#e0e7ff" text-anchor="middle">bubur apa ya?" 🥣</text>
  </g>

  <g transform="translate(660, 320)">
    <rect x="0" y="0" width="120" height="36" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="60" y="16" font-family="'Comic Sans MS', cursive" font-size="9" fill="#bae6fd" text-anchor="middle">"Momen malu</text>
    <text x="60" y="28" font-family="'Comic Sans MS', cursive" font-size="9" fill="#bae6fd" text-anchor="middle">pas kelas 5 SD" 💀</text>
  </g>

  <g transform="translate(660, 640)">
    <rect x="0" y="0" width="120" height="36" rx="10" fill="#1e1b4b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="60" y="16" font-family="'Comic Sans MS', cursive" font-size="9" fill="#bae6fd" text-anchor="middle">"Semut kalau tidur</text>
    <text x="60" y="28" font-family="'Comic Sans MS', cursive" font-size="9" fill="#bae6fd" text-anchor="middle">di mana ya?" 🐜</text>
  </g>

  <!-- Bottom Left: Spiral Cat Head -->
  <g transform="translate(35, 1070)">
    <use href="#spiralCat" x="0" y="0" />
  </g>

  <!-- Bottom Right: Digital Clock -->
  <g transform="translate(685, 1075)">
    <use href="#digitalClock" x="0" y="0" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#000000" stroke="#38bdf8" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#38bdf8" text-anchor="middle" letter-spacing="1">
      👀 03:00 AM • MENATAP LANGIT-LANGIT KAMAR 🌀
    </text>
  </g>
</svg>
