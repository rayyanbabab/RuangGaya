<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Warm Cozy Coffee Gradient -->
    <linearGradient id="fineBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="60%" stop-color="#fee2e2" />
      <stop offset="100%" stop-color="#ffedd5" />
    </linearGradient>

    <!-- Cartoon Flame Def -->
    <g id="cartoonFlame">
      <path d="M 0 40 C -15 25, -25 10, -10 -15 C -5 0, 5 -5, 0 -30 C 15 -10, 25 10, 15 25 C 20 15, 25 30, 0 40 Z" fill="#f97316" />
      <path d="M 0 38 C -8 26, -15 15, -6 -5 C -3 5, 3 2, 0 -15 C 10 -2, 15 12, 10 24 Z" fill="#facc15" />
      <ellipse cx="0" cy="28" rx="4" ry="7" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Coffee Mug -->
    <g id="coffeeMug" transform="scale(0.85)">
      <rect x="0" y="8" width="28" height="32" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2.5" />
      <!-- Handle -->
      <path d="M 28 14 C 38 14, 38 30, 28 30" fill="none" stroke="#1f2937" stroke-width="2.5" />
      <!-- Steam -->
      <path d="M 8 3 Q 12 -3 8 -9 M 18 3 Q 22 -3 18 -9" stroke="#9ca3af" stroke-width="2" fill="none" stroke-linecap="round" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#fineBg)" />

  <!-- Comic Half-tone Grid Lines -->
  <rect x="16" y="16" width="768" height="1168" rx="16" fill="none" stroke="#1f2937" stroke-width="4" />
  <rect x="24" y="24" width="752" height="1152" rx="10" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="10 8" />

  <!-- Cartoon Flames Lining Left Border -->
  <use href="#cartoonFlame" x="28" y="200" transform="scale(0.8)" />
  <use href="#cartoonFlame" x="32" y="380" transform="scale(0.7) rotate(10 32 380)" />
  <use href="#cartoonFlame" x="28" y="580" transform="scale(0.85)" />
  <use href="#cartoonFlame" x="30" y="780" transform="scale(0.75)" />

  <!-- Cartoon Flames Lining Right Border -->
  <use href="#cartoonFlame" x="770" y="220" transform="scale(-0.8, 0.8)" />
  <use href="#cartoonFlame" x="765" y="420" transform="scale(-0.75, 0.75)" />
  <use href="#cartoonFlame" x="770" y="620" transform="scale(-0.85, 0.85)" />
  <use href="#cartoonFlame" x="765" y="820" transform="scale(-0.7, 0.7)" />

  <!-- Top Banner: Speech Bubble "THIS IS FINE." -->
  <g transform="translate(400, 52)">
    <rect x="-160" y="-22" width="320" height="44" rx="12" fill="#ffffff" stroke="#1f2937" stroke-width="3" />
    <polygon points="0,22 15,34 20,22" fill="#ffffff" stroke="#1f2937" stroke-width="2.5" />
    <rect x="-1" y="19" width="22" height="5" fill="#ffffff" />
    <text x="0" y="7" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" fill="#b91c1c" text-anchor="middle" letter-spacing="1.5">
      🔥 THIS IS FINE. 🔥
    </text>
  </g>

  <!-- Top Left: Coffee Mug -->
  <use href="#coffeeMug" x="36" y="35" />

  <!-- Top Right: Little Fire Cluster -->
  <g transform="translate(735, 45) scale(0.9)">
    <use href="#cartoonFlame" x="0" y="0" />
  </g>

  <!-- Bottom Left: Iconic "This Is Fine" Dog Face -->
  <g transform="translate(35, 1070)">
    <!-- Dog Face -->
    <ellipse cx="45" cy="40" rx="32" ry="26" fill="#eab308" stroke="#1f2937" stroke-width="3" />
    <!-- Dog Muzzle -->
    <ellipse cx="45" cy="48" rx="20" ry="14" fill="#fef08a" stroke="#1f2937" stroke-width="2" />
    <ellipse cx="45" cy="42" rx="7" ry="5" fill="#1f2937" />
    <!-- Fedora Hat -->
    <ellipse cx="45" cy="20" rx="30" ry="8" fill="#1f2937" />
    <rect x="25" y="6" width="40" height="16" rx="4" fill="#1f2937" />
    <rect x="25" y="16" width="40" height="4" fill="#dc2626" />
    <!-- Big Derp Eyes -->
    <circle cx="34" cy="32" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2" />
    <circle cx="35" cy="32" r="3" fill="#1f2937" />
    <circle cx="56" cy="32" r="7" fill="#ffffff" stroke="#1f2937" stroke-width="2" />
    <circle cx="57" cy="32" r="3" fill="#1f2937" />
    <!-- Dog Smile -->
    <path d="M 38 54 Q 45 60 52 54" stroke="#1f2937" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Bottom Right: Coffee Cup & Fire -->
  <g transform="translate(720, 1090)">
    <use href="#coffeeMug" x="0" y="0" />
    <use href="#cartoonFlame" x="30" y="20" transform="scale(0.7)" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#1f2937" stroke="#ea580c" stroke-width="3" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#fef08a" text-anchor="middle" letter-spacing="1">
      ☕ I'M OKAY WITH THE EVENTS UNFOLDING ☕
    </text>
  </g>
</svg>
