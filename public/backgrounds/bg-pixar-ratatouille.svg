<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Warm French Bistro Cream Gradient -->
    <linearGradient id="bistroBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="60%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>

    <!-- Chef Toque Hat with Little Remy Ears -->
    <g id="remyChefHat" transform="scale(0.85)">
      <!-- Mouse Ears behind hat -->
      <circle cx="16" cy="18" r="14" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      <circle cx="16" cy="18" r="8" fill="#fda4af" />
      <circle cx="64" cy="18" r="14" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      <circle cx="64" cy="18" r="8" fill="#fda4af" />
      <!-- Chef Toque Pluff -->
      <path d="M 22 45 C 10 20, 30 5, 40 15 C 50 5, 70 20, 58 45 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="2.5" />
      <ellipse cx="40" cy="18" rx="24" ry="16" fill="#ffffff" />
      <rect x="24" y="42" width="32" height="14" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
    </g>

    <!-- Cheese Wedge -->
    <g id="cheeseWedge" transform="scale(0.85)">
      <polygon points="10,40 60,15 65,45 10,55" fill="#facc15" stroke="#ca8a04" stroke-width="2" />
      <polygon points="10,40 40,25 60,15" fill="#fde047" stroke="#ca8a04" stroke-width="2" />
      <!-- Cheese holes -->
      <ellipse cx="35" cy="38" rx="5" ry="4" fill="#ca8a04" />
      <ellipse cx="48" cy="28" rx="3" ry="3" fill="#ca8a04" />
      <ellipse cx="22" cy="45" rx="4" ry="3" fill="#ca8a04" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#bistroBg)" />

  <!-- Classic French Red Gingham Checked Borders -->
  <rect x="16" y="16" width="768" height="1168" rx="20" fill="none" stroke="#dc2626" stroke-width="4" />
  <rect x="24" y="24" width="752" height="1152" rx="14" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="14 10" />

  <!-- Top Center: Chef Remy Hat Badge -->
  <g transform="translate(400, 48)">
    <use href="#remyChefHat" x="-34" y="-32" />
    <text x="0" y="32" font-family="'Georgia', serif" font-size="14" font-style="italic" font-weight="bold" fill="#991b1b" text-anchor="middle">
      Chef Remy de Paris
    </text>
  </g>

  <!-- Top Left: French Baguette & Cheese -->
  <use href="#cheeseWedge" x="35" y="30" />

  <!-- Top Right: Wine / Fork & Spoon -->
  <g transform="translate(710, 32)">
    <circle cx="28" cy="28" r="24" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <text x="28" y="35" font-family="'Arial', sans-serif" font-size="18" fill="#ffffff" text-anchor="middle">🍷</text>
  </g>

  <!-- Side Herbs and Cheese Accents -->
  <use href="#cheeseWedge" x="25" y="380" transform="scale(0.75)" />
  <use href="#cheeseWedge" x="735" y="650" transform="scale(0.75)" />

  <!-- Bottom Left: Eiffel Tower Silhouette Sparkle -->
  <g transform="translate(40, 1070) scale(0.85)">
    <path d="M 30 10 L 30 0 L 34 0 L 34 10 L 44 45 L 52 70 L 40 70 Q 32 55 24 70 L 12 70 L 20 45 Z" fill="#991b1b" />
    <line x1="22" y1="45" x2="42" y2="45" stroke="#991b1b" stroke-width="3" />
    <circle cx="32" cy="-4" r="3" fill="#facc15" />
  </g>

  <!-- Bottom Right: Little Remy Hat & Grapes -->
  <g transform="translate(690, 1075)">
    <use href="#remyChefHat" x="0" y="0" transform="scale(0.8)" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#ffffff" opacity="0.95" stroke="#dc2626" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Georgia', 'Times New Roman', serif" font-size="19" font-weight="bold" fill="#991b1b" text-anchor="middle">
      🧀 Anyone Can Cook! • Bon Appétit 👨‍🍳✨
    </text>
  </g>
</svg>
