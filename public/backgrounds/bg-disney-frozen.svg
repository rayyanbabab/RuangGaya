<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Icy Frost Gradient -->
    <linearGradient id="frozenSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="40%" stop-color="#e0f2fe" />
      <stop offset="80%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#c7d2fe" />
    </linearGradient>

    <!-- Crystal Snowflake Def -->
    <g id="iceSnowflake" stroke="#0284c7" stroke-width="2" stroke-linecap="round" fill="none">
      <line x1="0" y1="-25" x2="0" y2="25" />
      <line x1="-25" y1="0" x2="25" y2="0" />
      <line x1="-18" y1="-18" x2="18" y2="18" />
      <line x1="-18" y1="18" x2="18" y2="-18" />
      <!-- Branches -->
      <path d="M 0 -15 L -6 -20 M 0 -15 L 6 -20" />
      <path d="M 0 15 L -6 20 M 0 15 L 6 20" />
      <path d="M -15 0 L -20 -6 M -15 0 L -20 6" />
      <path d="M 15 0 L 20 -6 M 15 0 L 20 6" />
      <circle cx="0" cy="0" r="3" fill="#ffffff" stroke="#0284c7" />
    </g>

    <!-- Olaf Snowman Silhouette -->
    <g id="olafSnowman" transform="scale(0.85)">
      <!-- Bottom ball -->
      <ellipse cx="35" cy="65" rx="26" ry="22" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
      <!-- Middle ball -->
      <ellipse cx="35" cy="40" rx="18" ry="16" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
      <!-- Head -->
      <ellipse cx="35" cy="18" rx="16" ry="18" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
      <!-- Twig hair -->
      <path d="M 35 2 L 30 -10 M 35 2 L 35 -12 M 35 2 L 40 -10" stroke="#78350f" stroke-width="2" />
      <!-- Carrot Nose -->
      <polygon points="35,18 55,22 35,25" fill="#f97316" />
      <!-- Coal eyes & buttons -->
      <circle cx="30" cy="15" r="3" fill="#1e293b" />
      <circle cx="40" cy="15" r="3" fill="#1e293b" />
      <circle cx="35" cy="38" r="3" fill="#1e293b" />
      <circle cx="35" cy="58" r="3.5" fill="#1e293b" />
      <!-- Smile -->
      <path d="M 28 26 Q 35 32 42 26" stroke="#1e293b" stroke-width="2" fill="#ffffff" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#frozenSky)" />

  <!-- Frost Patterns -->
  <rect x="18" y="18" width="764" height="1164" rx="22" fill="none" stroke="#0284c7" stroke-width="3" opacity="0.8" />
  <rect x="26" y="26" width="748" height="1148" rx="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="14 10" />

  <!-- Snowflakes floating around borders -->
  <use href="#iceSnowflake" x="50" y="70" transform="scale(1.1)" />
  <use href="#iceSnowflake" x="720" y="70" transform="scale(1)" />
  <use href="#iceSnowflake" x="35" y="320" transform="scale(0.8)" />
  <use href="#iceSnowflake" x="740" y="360" transform="scale(0.85)" />
  <use href="#iceSnowflake" x="30" y="620" transform="scale(0.9)" />
  <use href="#iceSnowflake" x="745" y="640" transform="scale(0.75)" />
  <use href="#iceSnowflake" x="40" y="880" transform="scale(0.85)" />
  <use href="#iceSnowflake" x="735" y="860" transform="scale(1)" />

  <!-- Top Center: Queen Elsa Ice Tiara / Snowflake -->
  <g transform="translate(400, 48)">
    <polygon points="0,-18 10,0 24,-12 18,12 0,20 -18,12 -24,-12 -10,0" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <circle cx="0" cy="5" r="4" fill="#ffffff" />
  </g>

  <!-- Bottom Left: Olaf Snowman -->
  <use href="#olafSnowman" x="35" y="1060" />

  <!-- Bottom Right: Big Sparkling Snowflake -->
  <g transform="translate(710, 1075)">
    <use href="#iceSnowflake" x="0" y="0" transform="scale(1.2)" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#ffffff" opacity="0.95" stroke="#0284c7" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Comic Sans MS', cursive" font-size="18" font-weight="bold" fill="#0369a1" text-anchor="middle">
      ❄️ Some People Are Worth Melting For ⛄💙
    </text>
  </g>
</svg>
