      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#202030" stroke-width="0.75" opacity="0.12" />
    </pattern>
  </defs>
  <!-- Acid Lime background -->
  <rect width="800" height="1200" fill="#d4ff00" />
  <rect width="800" height="1200" fill="url(#acidGrid)" />

