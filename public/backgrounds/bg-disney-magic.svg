<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Midnight Magic Royal Gradient -->
    <linearGradient id="magicSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="40%" stop-color="#302b63" />
      <stop offset="85%" stop-color="#24243e" />
      <stop offset="100%" stop-color="#191638" />
    </linearGradient>

    <!-- Gold Sparkle -->
    <g id="sparkleStar">
      <polygon points="20,0 24,14 38,20 24,26 20,40 16,26 2,20 16,14" fill="#fde047" />
      <circle cx="20" cy="20" r="3" fill="#ffffff" />
    </g>

    <!-- Mickey Constellation -->
    <g id="mickeyConstellation" opacity="0.85">
      <circle cx="24" cy="24" r="14" fill="none" stroke="#fef08a" stroke-width="2" stroke-dasharray="3 2" />
      <circle cx="12" cy="10" r="7" fill="none" stroke="#fef08a" stroke-width="2" />
      <circle cx="36" cy="10" r="7" fill="none" stroke="#fef08a" stroke-width="2" />
      <circle cx="24" cy="24" r="3" fill="#ffffff" />
      <circle cx="12" cy="10" r="2" fill="#ffffff" />
      <circle cx="36" cy="10" r="2" fill="#ffffff" />
    </g>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Night Sky -->
  <rect width="800" height="1200" fill="url(#magicSky)" />

  <!-- Magic Sparkle Trail Arch -->
  <path d="M 40 180 Q 200 40 400 60 T 760 180" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="4 6" opacity="0.6" />
  <path d="M 60 1020 Q 250 1140 400 1120 T 740 1020" fill="none" stroke="#c084fc" stroke-width="2" stroke-dasharray="5 7" opacity="0.5" />

  <!-- Elegant Golden Border -->
  <rect x="18" y="18" width="764" height="1164" rx="24" fill="none" stroke="#facc15" stroke-width="3" opacity="0.8" />
  <rect x="26" y="26" width="748" height="1148" rx="18" fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.6" stroke-dasharray="8 6" />

  <!-- Corner Flourishes -->
  <!-- Top Left -->
  <use href="#mickeyConstellation" x="36" y="32" />
  <!-- Top Right -->
  <use href="#sparkleStar" x="720" y="36" filter="url(#goldGlow)" />
  <!-- Left Side Sparkles -->
  <use href="#sparkleStar" x="25" y="450" transform="scale(0.65)" />
  <use href="#sparkleStar" x="28" y="750" transform="scale(0.55)" />
  <!-- Right Side Sparkles -->
  <use href="#sparkleStar" x="740" y="420" transform="scale(0.7)" />
  <use href="#mickeyConstellation" x="715" y="720" transform="scale(0.85)" />

  <!-- Shooting Stars / Fairy Dust Dots -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="120" cy="80" r="2.5" />
    <circle cx="180" cy="110" r="1.5" />
    <circle cx="260" cy="65" r="3" />
    <circle cx="340" cy="95" r="2" />
    <circle cx="480" cy="70" r="2.5" />
    <circle cx="560" cy="110" r="1.5" />
    <circle cx="640" cy="75" r="3" />
    <!-- Bottom Stars -->
    <circle cx="140" cy="1080" r="2" />
    <circle cx="220" cy="1110" r="2.5" />
    <circle cx="580" cy="1110" r="2.5" />
    <circle cx="660" cy="1080" r="2" />
  </g>

  <!-- Golden Cinderella Castle Silhouette at Bottom -->
  <g transform="translate(400, 1140)" filter="url(#goldGlow)">
    <!-- Central Main Spire -->
    <path d="M -16 -40 L 0 -85 L 16 -40 L 16 0 L -16 0 Z" fill="#facc15" />
    <polygon points="0,-95 -4,-85 4,-85" fill="#fef08a" />
    <!-- Center Spires Left & Right -->
    <path d="M -45 -25 L -35 -65 L -25 -25 L -25 0 L -45 0 Z" fill="#eab308" />
    <path d="M 25 -25 L 35 -65 L 45 -25 L 45 0 L 25 0 Z" fill="#eab308" />
    <!-- Outer Towers -->
    <path d="M -75 -15 L -65 -50 L -55 -15 L -55 0 L -75 0 Z" fill="#ca8a04" />
    <path d="M 55 -15 L 65 -50 L 75 -15 L 75 0 L 55 0 Z" fill="#ca8a04" />
    <!-- Gate & Walls -->
    <rect x="-85" y="-12" width="170" height="15" fill="#ca8a04" rx="2" />
    <path d="M -10 3 A 10 10 0 0 1 10 3 Z" fill="#302b63" />
  </g>

  <!-- Whimsical Typography Banner -->
  <g transform="translate(400, 1172)">
    <rect x="-220" y="-18" width="440" height="36" rx="18" fill="#1e1b4b" stroke="#facc15" stroke-width="2" opacity="0.95" />
    <text x="0" y="6" font-family="'Georgia', 'Times New Roman', serif" font-size="18" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">
      ✨ Where Dreams Come True ✨
    </text>
  </g>
</svg>
