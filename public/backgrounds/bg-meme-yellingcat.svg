<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Comic Soap Opera Drama Gradient -->
    <linearGradient id="smudgeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>

    <!-- Smudge the Cat Head Behind Salad Plate -->
    <g id="smudgeTheCat" transform="scale(0.85)">
      <!-- White Cat Head -->
      <ellipse cx="40" cy="30" rx="30" ry="24" fill="#ffffff" stroke="#1e293b" stroke-width="2.5" />
      <!-- Ears -->
      <polygon points="16,14 26,-4 36,12" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <polygon points="44,12 54,-4 64,14" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <!-- Confused Flat Eyes -->
      <line x1="26" y1="26" x2="36" y2="28" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
      <circle cx="31" cy="24" r="2.5" fill="#1e293b" />
      <line x1="44" y1="28" x2="54" y2="26" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
      <circle cx="49" cy="24" r="2.5" fill="#1e293b" />
      <!-- Nose & flat mouth -->
      <polygon points="40,34 37,38 43,38" fill="#fda4af" />
      <line x1="36" y1="42" x2="44" y2="42" stroke="#1e293b" stroke-width="2" />
      <!-- Salad Plate -->
      <ellipse cx="40" cy="62" rx="38" ry="12" fill="#ffffff" stroke="#1e293b" stroke-width="2" />
      <!-- Green lettuce leaves on plate -->
      <circle cx="30" cy="60" r="8" fill="#4ade80" />
      <circle cx="45" cy="58" r="9" fill="#22c55e" />
      <circle cx="38" cy="62" r="7" fill="#86efac" />
    </g>

    <!-- Pointing Hand & Accusing Finger -->
    <g id="pointingHand" stroke="#1e293b" stroke-width="2.5" fill="#fee2e2" transform="scale(0.85)">
      <path d="M 10 30 L 40 30 L 65 30 L 70 36 L 40 38 L 40 45 L 10 45 Z" />
      <path d="M 40 38 L 55 42 L 40 46" />
      <line x1="65" y1="30" x2="85" y2="30" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 2" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#smudgeBg)" />

  <!-- Borders -->
  <rect x="18" y="18" width="764" height="1164" rx="20" fill="none" stroke="#ef4444" stroke-width="3.5" />
  <rect x="26" y="26" width="748" height="1148" rx="14" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="14 10" />

  <!-- Top Center: Speech Bubble -->
  <g transform="translate(400, 52)">
    <rect x="-210" y="-22" width="420" height="44" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2.5" />
    <text x="0" y="7" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" fill="#dc2626" text-anchor="middle" letter-spacing="1">
      🤬 YOU WERE SUPPOSED TO BE SERIOUS! 🤬
    </text>
  </g>

  <!-- Top Left: Screaming / Pointing Finger -->
  <use href="#pointingHand" x="35" y="32" />

  <!-- Top Right: Innocent Salad Cat -->
  <use href="#smudgeTheCat" x="690" y="24" />

  <!-- Side Meme Badges -->
  <g transform="translate(22, 340)">
    <rect x="0" y="0" width="115" height="32" rx="8" fill="#ef4444" />
    <text x="57" y="21" font-family="'Arial Black', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">SOAP OPERA 🎭</text>
  </g>
  <g transform="translate(22, 680)">
    <rect x="0" y="0" width="115" height="32" rx="8" fill="#ef4444" />
    <text x="57" y="21" font-family="'Arial Black', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">WHY THO?! 😭</text>
  </g>

  <g transform="translate(670, 360)">
    <rect x="0" y="0" width="105" height="32" rx="8" fill="#22c55e" />
    <text x="52" y="21" font-family="'Arial Black', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">JUST SALAD 🥗</text>
  </g>
  <g transform="translate(670, 700)">
    <rect x="0" y="0" width="105" height="32" rx="8" fill="#22c55e" />
    <text x="52" y="21" font-family="'Arial Black', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">NOT GUILTY 😹</text>
  </g>

  <!-- Bottom Left: Pointing Lady Hand -->
  <g transform="translate(35, 1075)">
    <use href="#pointingHand" x="0" y="0" />
  </g>

  <!-- Bottom Right: Smudge Cat at Table -->
  <g transform="translate(685, 1055)">
    <use href="#smudgeTheCat" x="0" y="0" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#ffffff" opacity="0.95" stroke="#ef4444" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-size="18" fill="#1e293b" text-anchor="middle" letter-spacing="1">
      🥗 POINTING ANGRY LADY VS CONFUSED SALAD CAT 😹
    </text>
  </g>
</svg>
