<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Soft Melodramatic Pastel Gradient -->
    <linearGradient id="hamsterBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#fae8ff" />
    </linearGradient>

    <!-- Animated Teardrop -->
    <g id="tearDrop" fill="#38bdf8" opacity="0.85">
      <path d="M 0 -14 C -6 -4, -8 2, 0 10 C 8 2, 6 -4, 0 -14 Z" />
      <ellipse cx="-2" cy="4" rx="2" ry="4" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Pink Ribbon Bow -->
    <g id="sadBow" fill="#f43f5e" transform="scale(0.8)">
      <ellipse cx="-16" cy="-6" rx="14" ry="9" transform="rotate(-20 -16 -6)" />
      <ellipse cx="16" cy="-6" rx="14" ry="9" transform="rotate(20 16 -6)" />
      <circle cx="0" cy="0" r="5" fill="#e11d48" />
      <path d="M -4 4 Q -12 22 -18 28" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round" />
      <path d="M 4 4 Q 12 22 18 28" stroke="#f43f5e" stroke-width="3" fill="none" stroke-linecap="round" />
    </g>

    <!-- Tiny Sad Violin -->
    <g id="tinyViolin" transform="scale(0.85)">
      <ellipse cx="20" cy="30" rx="14" ry="18" fill="#b45309" stroke="#78350f" stroke-width="1.5" />
      <ellipse cx="20" cy="18" rx="10" ry="12" fill="#d97706" />
      <rect x="18" y="-6" width="4" height="24" fill="#451a03" />
      <!-- Bow -->
      <line x1="0" y1="40" x2="42" y2="8" stroke="#facc15" stroke-width="2" stroke-linecap="round" />
      <text x="38" y="4" font-family="'Courier New', monospace" font-size="12" fill="#9333ea">♪</text>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#hamsterBg)" />

  <!-- Heart & Tear Melodrama Borders -->
  <rect x="16" y="16" width="768" height="1168" rx="20" fill="none" stroke="#f43f5e" stroke-width="3.5" />
  <rect x="24" y="24" width="752" height="1152" rx="14" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="10 8" />

  <!-- Falling Tears on Side Borders -->
  <use href="#tearDrop" x="35" y="180" />
  <use href="#tearDrop" x="30" y="260" transform="scale(0.8)" />
  <use href="#tearDrop" x="35" y="600" />
  <use href="#tearDrop" x="32" y="800" transform="scale(0.85)" />

  <use href="#tearDrop" x="765" y="200" transform="scale(0.85)" />
  <use href="#tearDrop" x="760" y="400" />
  <use href="#tearDrop" x="765" y="620" transform="scale(0.8)" />
  <use href="#tearDrop" x="760" y="820" />

  <!-- Top Center: Speech Bubble "GWENCHANA..." -->
  <g transform="translate(400, 52)">
    <rect x="-180" y="-22" width="360" height="44" rx="22" fill="#ffffff" stroke="#f43f5e" stroke-width="2.5" />
    <polygon points="0,22 12,34 18,22" fill="#ffffff" stroke="#f43f5e" stroke-width="2" />
    <rect x="-1" y="20" width="20" height="5" fill="#ffffff" />
    <text x="0" y="7" font-family="'Comic Sans MS', cursive" font-size="19" font-weight="bold" fill="#e11d48" text-anchor="middle">
      🥺 Gwenchana... Ding-ding-ding 🎻
    </text>
  </g>

  <!-- Top Left: Sad Bow Ribbon -->
  <use href="#sadBow" x="42" y="42" />

  <!-- Top Right: Tiny Violin -->
  <use href="#tinyViolin" x="720" y="32" />

  <!-- Bottom Left: Iconic Giant Glossy Eye Sad Hamster -->
  <g transform="translate(35, 1055)">
    <!-- Hamster Ears -->
    <circle cx="22" cy="20" r="14" fill="#fed7aa" stroke="#c2410c" stroke-width="2" />
    <circle cx="22" cy="20" r="8" fill="#fda4af" />
    <circle cx="68" cy="20" r="14" fill="#fed7aa" stroke="#c2410c" stroke-width="2" />
    <circle cx="68" cy="20" r="8" fill="#fda4af" />
    <!-- Pink Ribbon on Ear -->
    <use href="#sadBow" x="22" y="10" transform="scale(0.7)" />
    <!-- Hamster Head -->
    <ellipse cx="45" cy="46" rx="36" ry="30" fill="#ffedd5" stroke="#c2410c" stroke-width="2" />
    <!-- Giant Sad Glossy Eyes -->
    <ellipse cx="28" cy="42" rx="13" ry="15" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="24" cy="36" r="6" fill="#ffffff" />
    <circle cx="33" cy="48" r="2.5" fill="#ffffff" />
    <ellipse cx="62" cy="42" rx="13" ry="15" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
    <circle cx="58" cy="36" r="6" fill="#ffffff" />
    <circle cx="67" cy="48" r="2.5" fill="#ffffff" />
    <!-- Nose & Mouth -->
    <polygon points="45,55 42,52 48,52" fill="#fb7185" />
    <path d="M 40 60 Q 45 57 50 60" stroke="#c2410c" stroke-width="2" fill="none" stroke-linecap="round" />
    <!-- Blush -->
    <ellipse cx="16" cy="56" rx="7" ry="4" fill="#f43f5e" opacity="0.3" />
    <ellipse cx="74" cy="56" rx="7" ry="4" fill="#f43f5e" opacity="0.3" />
  </g>

  <!-- Bottom Right: Tiny Crying Hamster Teardrop Stamp -->
  <g transform="translate(710, 1080)">
    <use href="#tinyViolin" x="0" y="0" />
    <use href="#tearDrop" x="40" y="30" transform="scale(0.9)" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-230" y="-22" width="460" height="44" rx="22" fill="#ffffff" opacity="0.95" stroke="#f43f5e" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Comic Sans MS', cursive" font-size="18" font-weight="bold" fill="#be185d" text-anchor="middle">
      🥺 GWENCHANA... GWENCHANAYOOO 🎻💧
    </text>
  </g>
</svg>
