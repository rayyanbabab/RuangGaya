<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- African Sunset Gradient -->
    <linearGradient id="savannahSunset" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12" />
      <stop offset="30%" stop-color="#c2410c" />
      <stop offset="65%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>

    <!-- Rafiki's Simba Cave Doodle -->
    <g id="simbaDoodle" transform="scale(0.85)">
      <!-- Mane circle -->
      <circle cx="35" cy="35" r="28" fill="none" stroke="#78350f" stroke-width="3.5" stroke-dasharray="10 6" />
      <!-- Ears -->
      <circle cx="16" cy="16" r="8" fill="none" stroke="#78350f" stroke-width="3" />
      <circle cx="54" cy="16" r="8" fill="none" stroke="#78350f" stroke-width="3" />
      <!-- Red Brow Mark -->
      <path d="M 28 22 Q 35 15 42 22" stroke="#dc2626" stroke-width="4" fill="none" stroke-linecap="round" />
      <!-- Eyes & Nose -->
      <circle cx="28" cy="32" r="3" fill="#78350f" />
      <circle cx="42" cy="32" r="3" fill="#78350f" />
      <polygon points="35,38 31,43 39,43" fill="#78350f" />
    </g>

    <!-- Acacia Tree Silhouette -->
    <g id="acaciaTree" fill="#451a03">
      <path d="M 40 80 L 42 40 Q 30 30 20 25 L 20 20 Q 35 22 45 32 Q 55 22 70 20 L 70 25 Q 60 30 46 40 L 48 80 Z" />
      <!-- Flat canopy tops -->
      <ellipse cx="20" cy="18" rx="22" ry="7" />
      <ellipse cx="45" cy="14" rx="26" ry="8" />
      <ellipse cx="70" cy="18" rx="20" ry="6" />
    </g>

    <!-- Paw Print -->
    <g id="savannahPaw" fill="#78350f" opacity="0.45" transform="scale(0.8)">
      <ellipse cx="20" cy="24" rx="14" ry="11" />
      <circle cx="8" cy="10" r="4.5" />
      <circle cx="17" cy="7" r="4.5" />
      <circle cx="26" cy="7" r="4.5" />
      <circle cx="34" cy="11" r="4.5" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#savannahSunset)" />

  <!-- Giant Sun Arch at Top -->
  <circle cx="400" cy="60" r="140" fill="#fef08a" opacity="0.4" />

  <!-- Borders -->
  <rect x="18" y="18" width="764" height="1164" rx="22" fill="none" stroke="#78350f" stroke-width="4" />
  <rect x="26" y="26" width="748" height="1148" rx="16" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="14 10" />

  <!-- Top Center: Simba Cave Drawing -->
  <use href="#simbaDoodle" x="370" y="25" />

  <!-- Top Left & Right: Acacia Trees -->
  <use href="#acaciaTree" x="30" y="25" transform="scale(0.85)" />
  <use href="#acaciaTree" x="710" y="25" transform="scale(-0.85, 0.85)" />

  <!-- Side Borders: Paw Prints -->
  <use href="#savannahPaw" x="35" y="320" transform="rotate(20 35 320)" />
  <use href="#savannahPaw" x="725" y="420" transform="rotate(-25 725 420)" />
  <use href="#savannahPaw" x="35" y="650" transform="rotate(-15 35 650)" />
  <use href="#savannahPaw" x="725" y="750" transform="rotate(18 725 750)" />

  <!-- Bottom Left: Rafiki's Simba Mark -->
  <use href="#simbaDoodle" x="35" y="1065" />

  <!-- Bottom Right: Pride Rock Silhouette -->
  <g transform="translate(680, 1075)">
    <polygon points="0,60 40,20 80,60" fill="#451a03" />
    <polygon points="40,20 60,10 70,30" fill="#78350f" />
    <circle cx="55" cy="5" r="8" fill="#fde047" opacity="0.8" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#451a03" stroke="#facc15" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Impact', 'Arial Black', sans-serif" font-size="20" font-weight="bold" fill="#fde047" text-anchor="middle" letter-spacing="1.5">
      🌅 HAKUNA MATATA! • NO WORRIES 🦁👑
    </text>
  </g>
</svg>
