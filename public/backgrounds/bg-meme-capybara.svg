<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Chill Onsen Pastel Gradient -->
    <linearGradient id="capyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="50%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Mandarin Orange Def -->
    <g id="mandarinOrange">
      <circle cx="0" cy="0" r="14" fill="#f97316" stroke="#c2410c" stroke-width="2" />
      <!-- Tiny green leaf -->
      <ellipse cx="0" cy="-14" rx="4" ry="7" fill="#16a34a" transform="rotate(35 0 -14)" />
    </g>

    <!-- Chill Capybara Face -->
    <g id="capyFace" transform="scale(0.85)">
      <!-- Head / Snout boxy oval -->
      <path d="M 15 20 C 15 5, 65 5, 65 20 C 70 35, 75 60, 60 70 C 45 75, 20 75, 15 60 Z" fill="#b45309" stroke="#78350f" stroke-width="2.5" />
      <!-- Snout bottom -->
      <ellipse cx="40" cy="58" rx="22" ry="14" fill="#92400e" />
      <!-- Small chill slit eyes -->
      <line x1="24" y1="28" x2="32" y2="28" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
      <line x1="48" y1="28" x2="56" y2="28" stroke="#000000" stroke-width="3.5" stroke-linecap="round" />
      <!-- Nose slits -->
      <ellipse cx="36" cy="54" rx="2.5" ry="4" fill="#000000" />
      <ellipse cx="44" cy="54" rx="2.5" ry="4" fill="#000000" />
      <!-- Tiny Ears -->
      <ellipse cx="14" cy="18" rx="6" ry="4" fill="#78350f" />
      <ellipse cx="66" cy="18" rx="6" ry="4" fill="#78350f" />
      <!-- Orange on head -->
      <use href="#mandarinOrange" x="40" y="4" />
    </g>

    <!-- Hot Spring Steam -->
    <g id="onsenSteam" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.6">
      <path d="M 0 15 Q 6 5 0 -5 Q -6 -15 0 -25" />
      <path d="M 12 15 Q 18 5 12 -5 Q 6 -15 12 -25" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#capyBg)" />

  <!-- Borders -->
  <rect x="18" y="18" width="764" height="1164" rx="22" fill="none" stroke="#b45309" stroke-width="3.5" />
  <rect x="26" y="26" width="748" height="1148" rx="16" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="14 10" />

  <!-- Top Center: Speech Bubble "OK I PULL UP" -->
  <g transform="translate(400, 52)">
    <rect x="-170" y="-22" width="340" height="44" rx="22" fill="#ffffff" stroke="#b45309" stroke-width="3" />
    <text x="0" y="7" font-family="'Impact', 'Arial Black', sans-serif" font-size="22" fill="#b45309" text-anchor="middle" letter-spacing="1.5">
      🍊 OK I PULL UP 🦫
    </text>
  </g>

  <!-- Top Left: Capybara with Orange -->
  <use href="#capyFace" x="35" y="22" />

  <!-- Top Right: Hot Spring Steam & Orange -->
  <g transform="translate(710, 35)">
    <use href="#onsenSteam" x="15" y="15" />
    <use href="#mandarinOrange" x="25" y="35" />
  </g>

  <!-- Side Borders: Oranges and Lotus Water -->
  <use href="#mandarinOrange" x="35" y="320" />
  <use href="#mandarinOrange" x="745" y="420" />
  <use href="#mandarinOrange" x="35" y="650" />
  <use href="#mandarinOrange" x="745" y="750" />

  <!-- Left: Chill Level 100% -->
  <g transform="translate(22, 480)">
    <rect x="0" y="0" width="110" height="30" rx="8" fill="#16a34a" />
    <text x="55" y="20" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">CHILL: 100% 🧘</text>
  </g>

  <!-- Right: No Stress Badge -->
  <g transform="translate(670, 520)">
    <rect x="0" y="0" width="105" height="30" rx="8" fill="#f97316" />
    <text x="52" y="20" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">NO STRESS ✨</text>
  </g>

  <!-- Bottom Left: Capybara in Tub -->
  <g transform="translate(35, 1070)">
    <use href="#capyFace" x="0" y="0" />
  </g>

  <!-- Bottom Right: Floating Oranges -->
  <g transform="translate(710, 1085)">
    <use href="#mandarinOrange" x="0" y="0" />
    <use href="#mandarinOrange" x="30" y="15" transform="scale(0.85)" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#ffffff" opacity="0.95" stroke="#b45309" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Comic Sans MS', cursive" font-size="18" font-weight="bold" fill="#78350f" text-anchor="middle">
      🍊 100% UNBOTHERED • PURE CAPYBARA ENERGY 🦫✨
    </text>
  </g>
</svg>
