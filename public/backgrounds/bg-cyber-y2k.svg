  <text x="60" y="1160" font-family="Courier, monospace" font-size="14" font-weight="bold" fill="#00f0ff" opacity="0.8" letter-spacing="4">★ Y2K DIGITAL PHOTOBOOTH // 2026 ★</text>
</svg>
