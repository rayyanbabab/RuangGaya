    <path d="M 80 500 C 80 470 50 470 50 495 C 50 520 80 540 80 540 C 80 540 110 520 110 495 C 110 470 80 470 80 500 Z" fill="none" stroke="#ff007f" stroke-width="3" />
    <path d="M 720 680 C 720 650 690 650 690 675 C 690 700 720 720 720 720 C 720 720 750 700 750 675 C 750 650 720 650 720 680 Z" fill="none" stroke="#00f0ff" stroke-width="3" />
