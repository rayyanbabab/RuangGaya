<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Sponge Yellow Gradient -->
    <linearGradient id="spongeYellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="50%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <!-- Bikini Bottom Flower Cloud -->
    <g id="flowerCloud" opacity="0.6">
      <circle cx="20" cy="8" r="10" fill="#a855f7" />
      <circle cx="32" cy="18" r="10" fill="#a855f7" />
      <circle cx="28" cy="32" r="10" fill="#a855f7" />
      <circle cx="12" cy="32" r="10" fill="#a855f7" />
      <circle cx="8" cy="18" r="10" fill="#a855f7" />
      <circle cx="20" cy="20" r="5" fill="#fef08a" />
    </g>

    <!-- Rainbow Arc -->
    <g id="rainbowArc">
      <path d="M 0 35 A 40 40 0 0 1 80 35" stroke="#ef4444" stroke-width="4" fill="none" />
      <path d="M 4 35 A 36 36 0 0 1 76 35" stroke="#f97316" stroke-width="4" fill="none" />
      <path d="M 8 35 A 32 32 0 0 1 72 35" stroke="#eab308" stroke-width="4" fill="none" />
      <path d="M 12 35 A 28 28 0 0 1 68 35" stroke="#22c55e" stroke-width="4" fill="none" />
      <path d="M 16 35 A 24 24 0 0 1 64 35" stroke="#3b82f6" stroke-width="4" fill="none" />
      <path d="M 20 35 A 20 20 0 0 1 60 35" stroke="#a855f7" stroke-width="4" fill="none" />
    </g>

    <!-- Sponge Pores -->
    <g id="spongePores" fill="#ca8a04" opacity="0.35">
      <ellipse cx="10" cy="15" rx="8" ry="12" />
      <ellipse cx="28" cy="8" rx="6" ry="6" />
      <ellipse cx="22" cy="28" rx="5" ry="7" />
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#spongeYellow)" />

  <!-- Sponge Pores Scattered -->
  <use href="#spongePores" x="30" y="160" />
  <use href="#spongePores" x="730" y="220" />
  <use href="#spongePores" x="35" y="580" />
  <use href="#spongePores" x="725" y="640" />
  <use href="#spongePores" x="30" y="880" />
  <use href="#spongePores" x="735" y="860" />

  <!-- Flower Clouds in Bikini Bottom Sky -->
  <use href="#flowerCloud" x="40" y="40" />
  <use href="#flowerCloud" x="720" y="50" transform="scale(0.85)" />

  <!-- Frames -->
  <rect x="18" y="18" width="764" height="1164" rx="20" fill="none" stroke="#ca8a04" stroke-width="3.5" />
  <rect x="26" y="26" width="748" height="1148" rx="14" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="14 10" />

  <!-- Top Center: Speech Bubble with Mocking SpongeBob Caps -->
  <g transform="translate(400, 52)">
    <rect x="-190" y="-22" width="380" height="44" rx="14" fill="#ffffff" stroke="#ca8a04" stroke-width="2.5" />
    <text x="0" y="7" font-family="'Comic Sans MS', cursive" font-size="20" font-weight="bold" fill="#b45309" text-anchor="middle">
      mAkE a CuTe PoSe 🤪
    </text>
  </g>

  <!-- Top Right: Rainbow Arc "IMAGINATION" -->
  <g transform="translate(690, 20)">
    <use href="#rainbowArc" x="0" y="0" />
  </g>

  <!-- Side Meme Badges -->
  <g transform="translate(22, 340)">
    <rect x="0" y="0" width="115" height="30" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="2" />
    <text x="57" y="20" font-family="'Comic Sans MS', cursive" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">kAnGuLaSi 🌈</text>
  </g>
  <g transform="translate(670, 360)">
    <rect x="0" y="0" width="105" height="30" rx="8" fill="#ffffff" stroke="#ca8a04" stroke-width="2" />
    <text x="52" y="20" font-family="'Comic Sans MS', cursive" font-size="10" font-weight="bold" fill="#b45309" text-anchor="middle">aRe YoU sUrE? 👀</text>
  </g>

  <!-- Bottom Left: Mocking SpongeBob Cartoon Face -->
  <g transform="translate(35, 1070)">
    <!-- Yellow Sponge Head -->
    <rect x="10" y="10" width="65" height="50" rx="10" fill="#fef08a" stroke="#ca8a04" stroke-width="2.5" />
    <!-- Two Big Derp Eyes -->
    <circle cx="28" cy="25" r="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" />
    <circle cx="28" cy="25" r="4" fill="#0284c7" />
    <circle cx="52" cy="25" r="10" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5" />
    <circle cx="52" cy="25" r="4" fill="#0284c7" />
    <!-- Buck Teeth -->
    <rect x="32" y="45" width="8" height="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1" />
    <rect x="42" y="45" width="8" height="8" fill="#ffffff" stroke="#ca8a04" stroke-width="1" />
    <!-- Derp Smile -->
    <path d="M 22 45 Q 40 55 58 45" stroke="#ca8a04" stroke-width="2" fill="none" />
  </g>

  <!-- Bottom Right: Gary the Snail -->
  <g transform="translate(710, 1075)">
    <!-- Pink Shell -->
    <circle cx="30" cy="30" r="22" fill="#f472b6" stroke="#db2777" stroke-width="2" />
    <circle cx="30" cy="30" r="12" fill="#38bdf8" />
    <circle cx="30" cy="30" r="4" fill="#f43f5e" />
    <!-- Body -->
    <rect x="10" y="46" width="45" height="12" rx="6" fill="#4ade80" />
    <!-- Eye Stalks -->
    <line x1="45" y1="46" x2="48" y2="24" stroke="#4ade80" stroke-width="3" />
    <circle cx="48" cy="22" r="5" fill="#fef08a" />
    <circle cx="48" cy="22" r="2" fill="#ef4444" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#ffffff" opacity="0.95" stroke="#ca8a04" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Comic Sans MS', cursive" font-size="18" font-weight="bold" fill="#b45309" text-anchor="middle">
      🧽 iTs cAlLeD aEsThEtIc, lOoK iT uP 🌈🤪
    </text>
  </g>
</svg>
