<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Warm Honey Golden Gradient -->
    <linearGradient id="honeyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="40%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Honey Bee Def -->
    <g id="honeyBee" transform="scale(0.85)">
      <!-- Wings -->
      <ellipse cx="-4" cy="-14" rx="7" ry="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-20 -4 -14)" opacity="0.8" />
      <ellipse cx="6" cy="-14" rx="7" ry="12" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5" transform="rotate(20 6 -14)" opacity="0.8" />
      <!-- Body -->
      <ellipse cx="0" cy="0" rx="14" ry="18" fill="#facc15" stroke="#78350f" stroke-width="2" transform="rotate(90 0 0)" />
      <!-- Stripes -->
      <path d="M -8 -8 L -8 8 M 0 -10 L 0 10 M 8 -8 L 8 8" stroke="#78350f" stroke-width="3" />
      <!-- Stinger & Face -->
      <polygon points="18,0 23,-3 23,3" fill="#78350f" />
      <circle cx="-10" cy="-2" r="2" fill="#78350f" />
    </g>

    <!-- Honey Pot Def -->
    <g id="hunnyPot" transform="scale(0.9)">
      <ellipse cx="40" cy="22" rx="24" ry="8" fill="#d97706" stroke="#92400e" stroke-width="2" />
      <!-- Pot belly -->
      <path d="M 16 22 C 10 35, 12 65, 40 65 C 68 65, 70 35, 64 22 Z" fill="#b45309" stroke="#78350f" stroke-width="2.5" />
      <!-- Dripping Honey on Pot -->
      <path d="M 22 22 Q 30 35 34 26 Q 42 42 48 24 Q 54 36 58 22 Z" fill="#facc15" />
      <text x="40" y="52" font-family="'Comic Sans MS', cursive" font-size="11" font-weight="bold" fill="#fef3c7" text-anchor="middle">HUNNY</text>
    </g>

    <!-- Daisy Flower -->
    <g id="daisy" transform="scale(0.8)">
      <g fill="#ffffff" stroke="#e2e8f0" stroke-width="1">
        <circle cx="0" cy="-12" r="7" />
        <circle cx="11" cy="-5" r="7" />
        <circle cx="8" cy="10" r="7" />
        <circle cx="-8" cy="10" r="7" />
        <circle cx="-11" cy="-5" r="7" />
      </g>
      <circle cx="0" cy="0" r="7" fill="#f59e0b" />
    </g>
  </defs>

  <!-- Honey Background -->
  <rect width="800" height="1200" fill="url(#honeyBg)" />

  <!-- Dripping Honey from Top Border -->
  <path d="M 0 0 L 800 0 L 800 35 Q 750 40 720 20 Q 680 55 640 25 Q 600 30 560 15 Q 520 60 480 20 Q 420 50 380 25 Q 340 70 300 30 Q 240 20 200 45 Q 160 15 120 55 Q 80 20 40 40 Q 20 15 0 30 Z" fill="#f59e0b" opacity="0.85" />
  <path d="M 0 0 L 800 0 L 800 25 Q 740 40 700 15 Q 640 45 600 20 Q 530 40 490 12 Q 430 38 390 18 Q 330 50 280 20 Q 210 35 170 12 Q 110 40 70 15 Q 30 30 0 20 Z" fill="#fde047" opacity="0.9" />

  <!-- Frame Borders -->
  <rect x="18" y="18" width="764" height="1164" rx="22" fill="none" stroke="#d97706" stroke-width="3" />
  <rect x="26" y="26" width="748" height="1148" rx="16" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="10 8" />

  <!-- Honey Bees Buzzing with Flight Paths -->
  <!-- Top Right Bee -->
  <path d="M 620 90 Q 680 60 710 110" fill="none" stroke="#92400e" stroke-width="1.5" stroke-dasharray="3 4" />
  <use href="#honeyBee" x="720" y="110" transform="rotate(-15 720 110)" />

  <!-- Left Border Bee -->
  <path d="M 50 460 Q 20 500 50 540" fill="none" stroke="#92400e" stroke-width="1.5" stroke-dasharray="3 4" />
  <use href="#honeyBee" x="45" y="520" transform="rotate(30 45 520)" />

  <!-- Right Border Bee -->
  <use href="#honeyBee" x="735" y="720" transform="rotate(-35 735 720)" />

  <!-- Daisies scattered on Corners -->
  <use href="#daisy" x="50" y="70" />
  <use href="#daisy" x="35" y="320" />
  <use href="#daisy" x="740" y="360" />
  <use href="#daisy" x="740" y="880" />

  <!-- Bottom Left: Hunny Pot -->
  <use href="#hunnyPot" x="35" y="1065" />

  <!-- Bottom Right: Daisy Cluster with Bee -->
  <g transform="translate(710, 1075)">
    <use href="#daisy" x="20" y="25" />
    <use href="#honeyBee" x="15" y="-10" transform="rotate(20 15 -10)" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-220" y="-22" width="440" height="44" rx="22" fill="#ffffff" opacity="0.95" stroke="#d97706" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Comic Sans MS', cursive" font-size="19" font-weight="bold" fill="#b45309" text-anchor="middle">
      🍯 Sweet as Honey • Silly Old Bear 🐝
    </text>
  </g>
</svg>
