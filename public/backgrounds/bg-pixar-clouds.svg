<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Sky Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- Cloud Def -->
    <g id="cloud">
      <ellipse cx="60" cy="40" rx="36" ry="24" fill="#ffffff" />
      <ellipse cx="90" cy="30" rx="30" ry="26" fill="#ffffff" />
      <ellipse cx="120" cy="40" rx="34" ry="22" fill="#ffffff" />
      <rect x="50" y="36" width="80" height="24" fill="#ffffff" rx="10" />
    </g>

    <!-- Pixar Luxo Ball -->
    <g id="pixarBall" transform="scale(0.8)">
      <circle cx="50" cy="50" r="46" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
      <path d="M 6 36 C 30 28, 70 28, 94 36 L 90 64 C 70 72, 30 72, 10 64 Z" fill="#2563eb" />
      <!-- Red Star -->
      <polygon points="50,22 56,38 72,38 59,48 64,64 50,54 36,64 41,48 28,38 44,38" fill="#ef4444" />
    </g>

    <!-- Sheriff Star -->
    <g id="sheriffBadge" transform="scale(0.85)">
      <polygon points="50,10 59,32 82,32 63,47 70,70 50,56 30,70 37,47 18,32 41,32" fill="#eab308" stroke="#ca8a04" stroke-width="3" />
      <circle cx="50" cy="10" r="5" fill="#ca8a04" />
      <circle cx="82" cy="32" r="5" fill="#ca8a04" />
      <circle cx="70" cy="70" r="5" fill="#ca8a04" />
      <circle cx="30" cy="70" r="5" fill="#ca8a04" />
      <circle cx="18" cy="32" r="5" fill="#ca8a04" />
      <circle cx="50" cy="42" r="14" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
      <text x="50" y="46" font-family="'Arial Black', sans-serif" font-size="7" font-weight="900" fill="#854d0e" text-anchor="middle">SHERIFF</text>
    </g>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="1200" fill="url(#skyGrad)" />

  <!-- Andy's Iconic Fluffy Clouds Pattern -->
  <use href="#cloud" x="20" y="40" />
  <use href="#cloud" x="600" y="50" transform="scale(0.85)" />
  <use href="#cloud" x="-10" y="320" transform="scale(0.75)" />
  <use href="#cloud" x="650" y="330" transform="scale(0.8)" />
  <use href="#cloud" x="10" y="620" transform="scale(0.8)" />
  <use href="#cloud" x="640" y="640" transform="scale(0.75)" />
  <use href="#cloud" x="20" y="920" transform="scale(0.85)" />
  <use href="#cloud" x="610" y="930" transform="scale(0.9)" />

  <!-- Woody Stitching Border Accent -->
  <rect x="14" y="14" width="772" height="1172" rx="20" fill="none" stroke="#f59e0b" stroke-width="4" stroke-dasharray="12 8" />
  <rect x="22" y="22" width="756" height="1156" rx="16" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.6" />

  <!-- Corner Badges -->
  <!-- Top Left: Sheriff Star -->
  <use href="#sheriffBadge" x="28" y="24" />

  <!-- Top Right: Little Green Alien -->
  <g transform="translate(680, 25)">
    <!-- Alien Head -->
    <ellipse cx="45" cy="40" rx="32" ry="24" fill="#84cc16" stroke="#4d7c0f" stroke-width="2.5" />
    <!-- Antenna -->
    <line x1="45" y1="16" x2="45" y2="2" stroke="#4d7c0f" stroke-width="3" />
    <circle cx="45" cy="0" r="5" fill="#84cc16" stroke="#4d7c0f" stroke-width="2" />
    <!-- Three Eyes -->
    <circle cx="30" cy="36" r="7" fill="#ffffff" stroke="#4d7c0f" stroke-width="1.5" />
    <circle cx="30" cy="36" r="3" fill="#1e293b" />
    <circle cx="45" cy="34" r="8" fill="#ffffff" stroke="#4d7c0f" stroke-width="1.5" />
    <circle cx="45" cy="34" r="3.5" fill="#1e293b" />
    <circle cx="60" cy="36" r="7" fill="#ffffff" stroke="#4d7c0f" stroke-width="1.5" />
    <circle cx="60" cy="36" r="3" fill="#1e293b" />
    <!-- Smile -->
    <path d="M 36 50 Q 45 56 54 50" stroke="#4d7c0f" stroke-width="2.5" fill="none" stroke-linecap="round" />
  </g>

  <!-- Bottom Left: Alien Says OOOOH -->
  <g transform="translate(40, 1105)">
    <rect x="0" y="0" width="130" height="42" rx="12" fill="#ffffff" stroke="#0284c7" stroke-width="2" />
    <polygon points="110,42 120,54 125,42" fill="#ffffff" />
    <text x="65" y="26" font-family="'Arial Black', sans-serif" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">THE CLAW! 🛸</text>
  </g>

  <!-- Bottom Right: Pixar Ball -->
  <use href="#pixarBall" x="690" y="1090" />

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <!-- Cloud banner base -->
    <rect x="-210" y="-22" width="420" height="44" rx="22" fill="#ffffff" opacity="0.95" stroke="#38bdf8" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Comic Sans MS', 'Arial Black', cursive, sans-serif" font-size="19" font-weight="bold" fill="#0369a1" text-anchor="middle">
      ☁️ To Infinity and Beyond! ⭐
    </text>
  </g>
</svg>
