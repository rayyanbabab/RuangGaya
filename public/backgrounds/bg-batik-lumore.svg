<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Background pattern -->
    <linearGradient id="ivoryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffef9" />
      <stop offset="50%" stop-color="#fdf9f0" />
      <stop offset="100%" stop-color="#fbf4e8" />
    </linearGradient>
    
    <!-- Central floral strip pattern -->
    <pattern id="batikFloralCenter" width="80" height="120" patternUnits="userSpaceOnUse">
      <!-- Petals pink/magenta -->
      <path d="M 40 30 Q 30 15 40 5 Q 50 15 40 30 Z" fill="#e85d75" opacity="0.85" />
      <path d="M 40 30 Q 30 45 40 55 Q 50 45 40 30 Z" fill="#e85d75" opacity="0.85" />
      <path d="M 40 30 Q 20 25 10 30 Q 20 35 40 30 Z" fill="#f43f5e" opacity="0.85" />
      <path d="M 40 30 Q 60 25 70 30 Q 60 35 40 30 Z" fill="#f43f5e" opacity="0.85" />
      <circle cx="40" cy="30" r="4" fill="#fbbf24" />
      
      <!-- Olive leaves -->
      <path d="M 40 60 Q 25 75 35 90 Q 45 75 40 60 Z" fill="#65a30d" opacity="0.65" />
      <path d="M 40 60 Q 55 75 45 90 Q 35 75 40 60 Z" fill="#84cc16" opacity="0.65" />
      <circle cx="40" cy="95" r="3" fill="#e11d48" opacity="0.8" />
    </pattern>

    <!-- Side border vine pattern -->
    <pattern id="batikSideVine" width="60" height="100" patternUnits="userSpaceOnUse">
      <path d="M 30 0 Q 15 25 30 50 Q 45 75 30 100" fill="none" stroke="#84cc16" stroke-width="2.5" opacity="0.75" />
      <ellipse cx="20" cy="25" rx="7" ry="4" fill="#65a30d" transform="rotate(-30 20 25)" opacity="0.7" />
      <ellipse cx="40" cy="75" rx="7" ry="4" fill="#65a30d" transform="rotate(30 40 75)" opacity="0.7" />
      <circle cx="30" cy="50" r="3.5" fill="#f43f5e" opacity="0.8" />
    </pattern>
  </defs>

  <!-- Base Ivory Background -->
  <rect width="800" height="1200" fill="url(#ivoryGrad)" />

  <!-- Outer ornamental border -->
  <rect x="14" y="14" width="772" height="1172" rx="16" fill="none" stroke="#e2d2ba" stroke-width="2" />
  <rect x="22" y="22" width="756" height="1156" rx="12" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6" />

  <!-- Left Vine Border -->
  <rect x="26" y="26" width="55" height="1148" fill="url(#batikSideVine)" />
  <!-- Right Vine Border -->
  <rect x="719" y="26" width="55" height="1148" fill="url(#batikSideVine)" />

  <!-- Center Decorative Divider Strip -->
  <rect x="365" y="26" width="70" height="1148" fill="url(#batikFloralCenter)" opacity="0.9" />

  <!-- Top / Bottom floral ornaments -->
  <g transform="translate(400, 38)">
    <circle cx="0" cy="0" r="16" fill="#fdf2f8" stroke="#e11d48" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#fbbf24" />
  </g>
  <g transform="translate(400, 1162)">
    <circle cx="0" cy="0" r="16" fill="#fdf2f8" stroke="#e11d48" stroke-width="2" />
    <circle cx="0" cy="0" r="5" fill="#fbbf24" />
  </g>

  <!-- Lumore Signature Watermark (Vertical on lower sides like in Jepreto) -->
  <text x="45" y="1080" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="700" fill="#202030" letter-spacing="4" transform="rotate(-90 45 1080)" opacity="0.85">Lumore</text>
  <text x="755" y="1080" font-family="'Cinzel', 'Playfair Display', serif" font-size="16" font-weight="700" fill="#202030" letter-spacing="4" transform="rotate(-90 755 1080)" opacity="0.85">Lumore</text>
</svg>
