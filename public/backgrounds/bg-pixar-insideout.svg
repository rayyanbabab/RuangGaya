<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Deep Imagination Void Gradient -->
    <linearGradient id="insideOutSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="40%" stop-color="#2e1065" />
      <stop offset="80%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#1e1035" />
    </linearGradient>

    <!-- Glowing Memory Orb Filter -->
    <filter id="orbGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Generic Glowing Memory Sphere -->
    <g id="memoryOrb">
      <circle cx="20" cy="20" r="18" fill="url(#orbLight)" />
      <circle cx="20" cy="20" r="18" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6" />
      <ellipse cx="14" cy="13" rx="5" ry="8" fill="#ffffff" opacity="0.5" transform="rotate(-30 14 13)" />
    </g>

    <radialGradient id="joyGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>

    <radialGradient id="sadnessGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>

    <radialGradient id="angerGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fecaca" />
      <stop offset="70%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </radialGradient>

    <radialGradient id="disgustGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="70%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </radialGradient>

    <radialGradient id="fearGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#insideOutSky)" />

  <!-- Dream Swirl Ribbon Track in Background -->
  <path d="M 0 100 Q 400 30 800 120" stroke="#a855f7" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="8 6" />
  <path d="M 0 1100 Q 400 1180 800 1080" stroke="#facc15" stroke-width="3" fill="none" opacity="0.4" stroke-dasharray="8 6" />

  <!-- Glowing Rainbow Borders -->
  <rect x="18" y="18" width="764" height="1164" rx="22" fill="none" stroke="#facc15" stroke-width="3" opacity="0.85" />
  <rect x="26" y="26" width="748" height="1148" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="12 8" />

  <!-- 5 Core Memory Orbs Arranged on Top Header -->
  <!-- 1. Joy (Yellow) -->
  <g transform="translate(180, 24)" filter="url(#orbGlow)">
    <circle cx="20" cy="20" r="18" fill="url(#joyGrad)" />
    <ellipse cx="14" cy="13" rx="5" ry="8" fill="#ffffff" opacity="0.6" transform="rotate(-30 14 13)" />
  </g>
  <!-- 2. Sadness (Blue) -->
  <g transform="translate(290, 24)" filter="url(#orbGlow)">
    <circle cx="20" cy="20" r="18" fill="url(#sadnessGrad)" />
    <ellipse cx="14" cy="13" rx="5" ry="8" fill="#ffffff" opacity="0.6" transform="rotate(-30 14 13)" />
  </g>
  <!-- 3. Joy Giant Center (Yellow) -->
  <g transform="translate(385, 16)" filter="url(#orbGlow)">
    <circle cx="25" cy="25" r="24" fill="url(#joyGrad)" />
    <ellipse cx="18" cy="16" rx="7" ry="11" fill="#ffffff" opacity="0.7" transform="rotate(-30 18 16)" />
    <text x="25" y="30" font-family="'Arial Black', sans-serif" font-size="12" fill="#713f12" text-anchor="middle">JOY</text>
  </g>
  <!-- 4. Anger (Red) -->
  <g transform="translate(485, 24)" filter="url(#orbGlow)">
    <circle cx="20" cy="20" r="18" fill="url(#angerGrad)" />
    <ellipse cx="14" cy="13" rx="5" ry="8" fill="#ffffff" opacity="0.6" transform="rotate(-30 14 13)" />
  </g>
  <!-- 5. Disgust (Green) -->
  <g transform="translate(595, 24)" filter="url(#orbGlow)">
    <circle cx="20" cy="20" r="18" fill="url(#disgustGrad)" />
    <ellipse cx="14" cy="13" rx="5" ry="8" fill="#ffffff" opacity="0.6" transform="rotate(-30 14 13)" />
  </g>

  <!-- Left Border Orbs -->
  <g transform="translate(24, 250)" filter="url(#orbGlow)">
    <circle cx="16" cy="16" r="15" fill="url(#joyGrad)" />
  </g>
  <g transform="translate(24, 550)" filter="url(#orbGlow)">
    <circle cx="16" cy="16" r="15" fill="url(#sadnessGrad)" />
  </g>
  <g transform="translate(24, 850)" filter="url(#orbGlow)">
    <circle cx="16" cy="16" r="15" fill="url(#disgustGrad)" />
  </g>

  <!-- Right Border Orbs -->
  <g transform="translate(735, 280)" filter="url(#orbGlow)">
    <circle cx="16" cy="16" r="15" fill="url(#fearGrad)" />
  </g>
  <g transform="translate(735, 580)" filter="url(#orbGlow)">
    <circle cx="16" cy="16" r="15" fill="url(#angerGrad)" />
  </g>
  <g transform="translate(735, 880)" filter="url(#orbGlow)">
    <circle cx="16" cy="16" r="15" fill="url(#joyGrad)" />
  </g>

  <!-- Bottom Left: Memory Shelves Badge -->
  <g transform="translate(35, 1075)">
    <rect x="0" y="0" width="110" height="42" rx="12" fill="#581c87" stroke="#facc15" stroke-width="2" />
    <text x="55" y="18" font-family="'Arial Black', sans-serif" font-size="10" fill="#fef08a" text-anchor="middle">CORE</text>
    <text x="55" y="32" font-family="'Arial Black', sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">MEMORIES 🌟</text>
  </g>

  <!-- Bottom Right: Rainbow Train of Thought Track -->
  <g transform="translate(680, 1075)" filter="url(#orbGlow)">
    <circle cx="20" cy="20" r="18" fill="url(#fearGrad)" />
    <circle cx="50" cy="20" r="18" fill="url(#joyGrad)" />
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#0f172a" stroke="#facc15" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Arial Black', 'Comic Sans MS', sans-serif" font-size="18" font-weight="bold" fill="#fde047" text-anchor="middle" letter-spacing="1">
      ✨ MAKING CORE MEMORIES FOREVER 🧠💛
    </text>
  </g>
</svg>
