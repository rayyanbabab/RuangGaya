<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1200" viewBox="0 0 800 1200">
  <defs>
    <!-- Sulley Turquoise Background -->
    <linearGradient id="sulleyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Monster Door Def -->
    <g id="monsterDoor" transform="scale(0.8)">
      <rect x="0" y="0" width="34" height="60" rx="3" fill="#fb7185" stroke="#be123c" stroke-width="2" />
      <!-- Small white flower on Boo's door -->
      <circle cx="17" cy="25" r="5" fill="#ffffff" />
      <circle cx="17" cy="25" r="2" fill="#fbbf24" />
      <!-- Knob -->
      <circle cx="28" cy="32" r="2.5" fill="#facc15" />
    </g>

    <!-- Yellow Scream Canister -->
    <g id="screamCanister" transform="scale(0.85)">
      <rect x="10" y="8" width="32" height="64" rx="10" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
      <!-- Meter Gauge -->
      <rect x="16" y="20" width="8" height="40" rx="4" fill="#1e293b" />
      <rect x="18" y="24" width="4" height="32" rx="2" fill="#ef4444" />
      <!-- Cap & Bottom -->
      <rect x="14" y="2" width="24" height="8" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      <rect x="14" y="70" width="24" height="8" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2" />
      <text x="36" y="44" font-family="'Arial Black', sans-serif" font-size="7" font-weight="900" fill="#854d0e" transform="rotate(90 36 44)">SCREAM</text>
    </g>
  </defs>

  <!-- Sulley Fur Pattern -->
  <rect width="800" height="1200" fill="url(#sulleyGrad)" />

  <!-- Sulley Purple Spots scattered -->
  <g fill="#c084fc" opacity="0.6">
    <ellipse cx="60" cy="160" rx="42" ry="28" transform="rotate(-15 60 160)" />
    <ellipse cx="730" cy="200" rx="50" ry="34" transform="rotate(25 730 200)" />
    <ellipse cx="40" cy="500" rx="36" ry="24" transform="rotate(10 40 500)" />
    <ellipse cx="750" cy="540" rx="44" ry="30" transform="rotate(-20 750 540)" />
    <ellipse cx="50" cy="850" rx="40" ry="26" transform="rotate(15 50 850)" />
    <ellipse cx="740" cy="880" rx="48" ry="32" transform="rotate(-10 740 880)" />
    <ellipse cx="400" cy="40" rx="60" ry="22" />
    <ellipse cx="140" cy="1130" rx="45" ry="25" />
    <ellipse cx="660" cy="1130" rx="45" ry="25" />
  </g>

  <!-- Lime Green Caution & Industrial Frame Border -->
  <rect x="16" y="16" width="768" height="1168" rx="20" fill="none" stroke="#84cc16" stroke-width="4" />
  <rect x="24" y="24" width="752" height="1152" rx="14" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="14 10" />

  <!-- Top Left: Mike Wazowski Cartoon Face -->
  <g transform="translate(30, 26)">
    <!-- Body / Head -->
    <circle cx="45" cy="45" r="38" fill="#84cc16" stroke="#4d7c0f" stroke-width="3" />
    <!-- Horns -->
    <polygon points="18,18 24,6 30,18" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <polygon points="60,18 66,6 72,18" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
    <!-- Big Eye -->
    <circle cx="45" cy="40" r="19" fill="#ffffff" stroke="#4d7c0f" stroke-width="2" />
    <circle cx="45" cy="40" r="10" fill="#0284c7" />
    <circle cx="45" cy="40" r="5" fill="#0f172a" />
    <circle cx="42" cy="37" r="2.5" fill="#ffffff" />
    <!-- Grin -->
    <path d="M 28 62 Q 45 74 62 62" stroke="#166534" stroke-width="3" fill="#ffffff" />
    <!-- Teeth -->
    <path d="M 36 65 L 36 69 M 45 66 L 45 70 M 54 65 L 54 69" stroke="#166534" stroke-width="1.5" />
  </g>

  <!-- Top Right: Scream Canister -->
  <use href="#screamCanister" x="710" y="24" />

  <!-- Floating Doors Along the Sides -->
  <use href="#monsterDoor" x="20" y="320" />
  <use href="#monsterDoor" x="745" y="380" transform="rotate(10 745 380)" />
  <use href="#monsterDoor" x="20" y="680" transform="rotate(-8 20 680)" />
  <use href="#monsterDoor" x="745" y="720" />

  <!-- Bottom Left: Mike's Hardhat -->
  <g transform="translate(40, 1085)">
    <ellipse cx="35" cy="30" rx="32" ry="18" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2.5" />
    <ellipse cx="35" cy="18" rx="22" ry="14" fill="#60a5fa" />
    <!-- Eye logo on helmet -->
    <circle cx="35" cy="22" r="7" fill="#ffffff" />
    <circle cx="35" cy="22" r="3.5" fill="#1e293b" />
    <text x="35" y="58" font-family="'Arial Black', sans-serif" font-size="10" font-weight="bold" fill="#0f172a" text-anchor="middle">MIKE &amp; SULLEY</text>
  </g>

  <!-- Bottom Right: Laugh Power Canister Badge -->
  <g transform="translate(685, 1090)">
    <circle cx="40" cy="35" r="30" fill="#facc15" stroke="#ca8a04" stroke-width="3" />
    <text x="40" y="33" font-family="'Arial Black', sans-serif" font-size="14" font-weight="900" fill="#1e293b" text-anchor="middle">100%</text>
    <text x="40" y="47" font-family="'Arial Black', sans-serif" font-size="9" font-weight="bold" fill="#ca8a04" text-anchor="middle">LAUGHTER</text>
  </g>

  <!-- Bottom Center Ribbon & Typography -->
  <g transform="translate(400, 1150)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" fill="#1e293b" stroke="#84cc16" stroke-width="2.5" />
    <text x="0" y="6" font-family="'Arial Black', sans-serif" font-size="17" font-weight="bold" fill="#a3e635" text-anchor="middle" letter-spacing="0.5">
      👁️ WE SCARE BECAUSE WE CARE! 🚪
    </text>
  </g>
</svg>
